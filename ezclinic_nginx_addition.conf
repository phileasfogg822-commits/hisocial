
# HTTP - ezclinic360.com
server {
    listen 80;
    listen [::]:80;
    server_name ezclinic360.com www.ezclinic360.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.ezclinic360.com$request_uri;
    }
}

# HTTPS - non-www redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ezclinic360.com;

    ssl_certificate /etc/letsencrypt/live/ezclinic360.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ezclinic360.com/privkey.pem;

    return 301 https://www.ezclinic360.com$request_uri;
}

# HTTPS - main
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ezclinic360.com;

    ssl_certificate /etc/letsencrypt/live/ezclinic360.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ezclinic360.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 25m;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location / {
        proxy_pass http://172.17.0.1:6002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
